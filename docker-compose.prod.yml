# ================================================================
# PRODUCTION DOCKER COMPOSE CONFIGURATION
# ================================================================
# Secure production setup with:
# - No exposed database ports (internal only)
# - Nginx reverse proxy with SSL support
# - Health checks and logging
# - Automated backups
# - Resource optimization
#
# Usage:
#   1. Configure .env.production
#   2. Deploy: cd deploy/scripts && ./deploy.sh prod
# ================================================================

services:
  # ================================
  # Database - MySQL 8.0 (Production)
  # ================================
  mysql:
    image: mysql:8.0
    container_name: apartment-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    # NO PORTS EXPOSED - internal only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./deploy/backups:/backups
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=2G
      --innodb_log_file_size=512M
      --innodb_flush_log_at_trx_commit=1
      --slow_query_log=1
      --long_query_time=2
      --skip-name-resolve
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - apartment_network

  # ================================
  # Cache & Sessions - Redis 7 (Production)
  # ================================
  redis:
    image: redis:7-alpine
    container_name: apartment-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
      --tcp-keepalive 300
      --timeout 0
    # NO PORTS EXPOSED - internal only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - apartment_network

  # ================================
  # Backend API - NestJS (Production)
  # ================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    container_name: apartment-backend
    restart: always
    expose:
      - '3000'
    environment:
      # Application
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api/v1}
      APP_NAME: ${APP_NAME:-Apartment Management}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}

      # Database
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DATABASE_HOST:-mysql}
      DB_PORT: ${DATABASE_PORT:-3306}
      DB_USERNAME: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_DATABASE: ${DATABASE_NAME}
      DB_LOGGING: 'false'
      DB_SYNCHRONIZE: 'false'
      DB_RUN_MIGRATIONS: 'true'
      DB_MIGRATIONS_RUN: 'false'

      # Database Connection Pool
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-30000}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-10000}
      DB_POOL_MAX_REUSES: ${DB_POOL_MAX_REUSES:-100}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TTL: ${REDIS_TTL:-3600}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Session Management
      SESSION_PREFIX: ${SESSION_PREFIX:-sess:}
      SESSION_TTL: ${SESSION_TTL:-900}
      REFRESH_SESSION_PREFIX: ${REFRESH_SESSION_PREFIX:-refresh:}
      REFRESH_SESSION_TTL: ${REFRESH_SESSION_TTL:-604800}

      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Apartment Management}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      # Rate Limiting
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}

      # Queue (BullMQ)
      QUEUE_REDIS_HOST: ${REDIS_HOST:-redis}
      QUEUE_REDIS_PORT: ${REDIS_PORT:-6379}
      QUEUE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_REDIS_DB: ${QUEUE_REDIS_DB:-1}
      QUEUE_JOB_ATTEMPTS: ${QUEUE_JOB_ATTEMPTS:-3}
      QUEUE_JOB_BACKOFF_DELAY: ${QUEUE_JOB_BACKOFF_DELAY:-5000}
      QUEUE_COMPLETED_JOB_AGE: ${QUEUE_COMPLETED_JOB_AGE:-86400}
      QUEUE_FAILED_JOB_AGE: ${QUEUE_FAILED_JOB_AGE:-604800}

      # Reminders
      REMINDER_DUE_SOON_DAYS: ${REMINDER_DUE_SOON_DAYS:-3}
      REMINDER_DUE_SOON_CRON: ${REMINDER_DUE_SOON_CRON:-0 9 * * *}
      REMINDER_OVERDUE_CRON: ${REMINDER_OVERDUE_CRON:-0 10 * * *}
      REMINDER_OVERDUE_INTERVAL_DAYS: ${REMINDER_OVERDUE_INTERVAL_DAYS:-7}
      REMINDER_MAX_RETRIES: ${REMINDER_MAX_RETRIES:-3}

      # Security
      CORS_ORIGINS: ${CORS_ORIGINS}
      CSRF_ENABLED: 'true'
      HELMET_ENABLED: 'true'

      # Features
      FEATURE_TENANT_PORTAL: ${FEATURE_TENANT_PORTAL:-true}
      FEATURE_FILE_UPLOAD: ${FEATURE_FILE_UPLOAD:-true}
      FEATURE_AUDIT_LOG: ${FEATURE_AUDIT_LOG:-true}
      FEATURE_QUEUE_ENABLED: ${FEATURE_QUEUE_ENABLED:-true}

      # Monitoring
      HEALTH_CHECK_ENABLED: 'true'
      METRICS_ENABLED: ${METRICS_ENABLED:-true}

    volumes:
      - backend_logs:/app/backend/logs
      - uploads:/app/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      - apartment_network

  # ================================
  # Frontend UI - Next.js 15 (Production)
  # ================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: apartment-frontend
    restart: always
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: ${FRONTEND_PORT:-3001}
      HOSTNAME: '0.0.0.0'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3001", (r) => process.exit(r.statusCode === 200 ? 0 : 1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - apartment_network

  # ================================
  # Reverse Proxy - Nginx (Production)
  # ================================
  nginx:
    image: nginx:alpine
    container_name: apartment-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - apartment_network

  # ================================
  # SSL Certificates - Certbot (Optional)
  # ================================
  # Uncomment this service for automatic SSL certificates
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: apartment-certbot
  #   volumes:
  #     - ./nginx/ssl:/etc/letsencrypt
  #     - certbot_webroot:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - apartment_network

  # ================================
  # MySQL Backup Service (Optional)
  # ================================
  # Uncomment for automated daily backups
  # mysql-backup:
  #   image: mysql:8.0
  #   container_name: apartment-mysql-backup
  #   restart: always
  #   volumes:
  #     - mysql_data:/var/lib/mysql:ro
  #     - ./deploy/backups:/backups
  #     - ./scripts/mysql-backup.sh:/backup.sh:ro
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${DATABASE_NAME}
  #   command: >
  #     sh -c 'while true; do
  #       sleep 86400;
  #       /backup.sh;
  #     done'
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - apartment_network

# ================================
# Volumes
# ================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  uploads:
    driver: local
  nginx_cache:
    driver: local
  certbot_webroot:
    driver: local

# ================================
# Networks
# ================================
networks:
  apartment_network:
    driver: bridge
    name: apartment_network
