# ================================================================
# TernantApp - Production Docker Compose Configuration
# ================================================================
# This file extends the main docker-compose.yml with production optimizations
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full-stack up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile apps-only up -d
# ================================================================

services:
  # ================================
  # INFRASTRUCTURE OVERRIDES
  # ================================

  mysql:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ================================
  # APPLICATION OVERRIDES
  # ================================

  backend:
    build:
      target: production
    restart: always
    environment:
      NODE_ENV: production
      DB_LOGGING: "false"
      DB_SYNCHRONIZE: "false"
    # Production: No source code mounting
    volumes:
      - backend_logs:/app/backend/logs
      - uploads_data:/app/backend/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      target: production
    restart: always
    environment:
      NODE_ENV: production
    # Production: No source code mounting
    volumes: []
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
