# ================================================================
# MONITORING STACK - OPTIONAL
# ================================================================
# Complete monitoring solution with:
# - Prometheus for metrics collection
# - Grafana for visualization
# - Loki for log aggregation
# - Promtail for log shipping
# - Alertmanager for alerts
# - Exporters for system, MySQL, and Redis metrics
#
# Usage:
#   docker-compose -f docker-compose.monitoring.yml up -d
#
# Access:
#   - Grafana: http://localhost:3002 (admin/admin)
#   - Prometheus: http://localhost:9090
#   - Alertmanager: http://localhost:9093
# ================================================================

services:
  # ================================
  # Prometheus - Metrics Collection
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: apartment-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks:
      - apartment_network
      - monitoring_network

  # ================================
  # Grafana - Visualization
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: apartment-grafana
    restart: always
    ports:
      - '3002:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_network

  # ================================
  # Loki - Log Aggregation
  # ================================
  loki:
    image: grafana/loki:latest
    container_name: apartment-loki
    restart: always
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  # ================================
  # Promtail - Log Shipper
  # ================================
  promtail:
    image: grafana/promtail:latest
    container_name: apartment-promtail
    restart: always
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

  # ================================
  # Alertmanager - Alert Routing
  # ================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: apartment-alertmanager
    restart: always
    ports:
      - '9093:9093'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring_network

  # ================================
  # Node Exporter - System Metrics
  # ================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: apartment-node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - '9100:9100'
    networks:
      - monitoring_network

  # ================================
  # cAdvisor - Container Metrics
  # ================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: apartment-cadvisor
    restart: always
    ports:
      - '8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring_network

  # ================================
  # MySQL Exporter - Database Metrics
  # ================================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: apartment-mysql-exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=${DATABASE_USER}:${DATABASE_PASSWORD}@(mysql:3306)/${DATABASE_NAME}
    ports:
      - '9104:9104'
    depends_on:
      - prometheus
    networks:
      - apartment_network
      - monitoring_network

  # ================================
  # Redis Exporter - Cache Metrics
  # ================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: apartment-redis-exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - '9121:9121'
    depends_on:
      - prometheus
    networks:
      - apartment_network
      - monitoring_network

# ================================
# Volumes
# ================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alertmanager_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  apartment_network:
    external: true
    name: apartment_network
  monitoring_network:
    driver: bridge
    name: monitoring_network
