# ================================================================
# PRODUCTION TEST - Simplified for Local Testing
# ================================================================
# This is a simplified version for testing production setup locally
# - No SSL/Certbot (use HTTP)
# - No replicas (single instance)
# - Exposed ports for testing
# - All production features except scaling
# ================================================================

version: '3.8'

services:
  # ================================
  # Database - MySQL 8.0
  # ================================
  mysql:
    image: mysql:8.0
    container_name: apartment-mysql-test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${DB_DATABASE:-apartment_management}
      MYSQL_USER: ${DB_USERNAME:-apartment_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-test_password_123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=1G
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - database_network
      - backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Redis - Cache & Queue
  # ================================
  redis:
    image: redis:7-alpine
    container_name: apartment-redis-test
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-test_redis_123}
    command: >
      sh -c "redis-server
      --requirepass ${REDIS_PASSWORD:-test_redis_123}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a "${REDIS_PASSWORD:-test_redis_123}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Backend API - NestJS
  # ================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    image: apartment-backend-test:latest
    container_name: apartment-backend-test
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      APP_NAME: ${APP_NAME}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}

      # Database
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:-test_password_123}
      DB_DATABASE: ${DB_DATABASE}
      DB_LOGGING: false
      DB_SYNCHRONIZE: false
      DB_RUN_MIGRATIONS: true
      DB_POOL_SIZE: 20

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-test_redis_123}
      REDIS_DB: 0
      REDIS_TTL: 3600

      # JWT
      JWT_SECRET: ${JWT_SECRET:-test_jwt_secret_min_32_chars_long_12345}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test_jwt_refresh_secret_min_32_chars_long_12345}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}

      # Session
      SESSION_PREFIX: 'session:'
      SESSION_TTL: 900

      # Email
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-test_mail_password}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}

      # Rate Limiting
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}

      # Queue
      QUEUE_REDIS_HOST: redis
      QUEUE_REDIS_PORT: 6379
      QUEUE_REDIS_PASSWORD: ${REDIS_PASSWORD:-test_redis_123}
      QUEUE_REDIS_DB: 1

      # Security
      CORS_ORIGINS: ${CORS_ORIGINS}
      CSRF_ENABLED: true
      HELMET_ENABLED: true

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - backend_network
      - database_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Frontend UI - Next.js
  # ================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: apartment-frontend-test:latest
    container_name: apartment-frontend-test
    restart: always
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - frontend_network
      - backend_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ================================
# Volumes
# ================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  database_network:
    driver: bridge
